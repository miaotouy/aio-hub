name: 移动端构建和发布

on:
  push:
    tags:
      - "v*.*.*-m" # 当推送带 -m 后缀的版本标签时触发（如 v0.1.9-m）
      - "v*.*.*-m-*" # （如 v0.1.9-m-beta.1）
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mobile/src-tauri -> target"

      - name: 安装前端依赖
        run: |
          bun install
          cd mobile && bun install

      - name: 构建 Android 应用
        run: bun run mtab -- --apk --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aio-hub-mobile-android-${{ github.ref_name }}
          path: mobile/src-tauri/target/release/bundle/android/*

  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取发布信息
        id: get-release-info
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            RELEASE_NAME="AIO Hub Mobile ${VERSION}"
            IS_DRAFT="false"
          else
            VERSION="mobile-main"
            RELEASE_NAME="AIO Hub Mobile main 草案 (${SHORT_SHA})"
            IS_DRAFT="true"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "is_draft=${IS_DRAFT}" >> $GITHUB_OUTPUT

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-release-info.outputs.version }}
          name: ${{ steps.get-release-info.outputs.name }}
          body: |
            ## 📱 移动端版本发布

            这是 AIO Hub 的移动端构建版本。



            ### 下载说明
            - **Android**:
              - `android-arm64-v8a-*.apk`: 适用于大多数现代安卓手机。
              - `android-universal-*.apk`: 通用版本。
              - `android-armeabi-v7a-*.apk`: 适用于旧款 32 位安卓手机。

            ### 注意事项
            - 移动端目前处于开发预览阶段。
            - 推荐优先下载 `arm64-v8a` 版本以获得最佳性能。
            - 当前 Android 产物为未签名构建，仅适合测试与预览。
          draft: ${{ steps.get-release-info.outputs.is_draft }}
          prerelease: ${{ contains(steps.get-release-info.outputs.version, 'beta') || contains(steps.get-release-info.outputs.version, 'alpha') }}
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
