[package]
name = "aiohub-mobile"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aiohub_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2.5.4"
tauri-plugin-os = "2.3.2"
tiktoken-rs = "0.12.0"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "http2", "charset", "gzip", "brotli", "deflate", "multipart"] }
tokio = { version = "1", features = ["fs", "sync", "macros", "rt-multi-thread", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
http-range = "0.1.5"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tauri-plugin-dialog = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
